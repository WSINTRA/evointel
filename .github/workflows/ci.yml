name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          working-directory: memory-proto

      - name: Clippy
        working-directory: memory-proto
        run: cargo clippy -- -D warnings

      # --test-threads=1: lbug's buffer manager maps a very large virtual
      # region per open DB, and ~17 parallel test processes each opening a DB
      # exhausts the address space (mmap 8 TiB) and flakes the suite.
      # Running serially makes the run deterministic.
      - name: Test
        working-directory: memory-proto
        run: cargo test -- --test-threads=1
